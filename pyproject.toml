[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "option-tracker"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31.0",
    "simplejson>=3.20.1",
    "pandas>=2.0.0",
    "numpy>=1.26.0",
    "python-dateutil>=2.8.2",
    "tzdata>=2024.1",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "orjson>=3.9.0",
    "certifi>=2024.2.2",
]

[project.scripts]
option-tracker-web = "option_tracker.webapp.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["option_tracker*"]

[tool.setuptools.package-data]
"option_tracker.webapp" = ["static/*"]
