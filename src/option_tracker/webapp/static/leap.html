<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Options Pulse · LEAPs</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
  <link rel="stylesheet" href="/static/app.css" />
  <script src="https://code.highcharts.com/highcharts.js"></script>
  <script src="https://code.highcharts.com/highcharts-more.js"></script>
  <script src="https://code.highcharts.com/modules/exporting.js"></script>
</head>
<body>
  <nav class="navbar">
    <span class="brand"><img class="brand-icon" src="/static/favicon.svg" alt="" />Options Pulse</span>
    <a href="/">PUT CALL Option Chain</a>
    <a href="/leap" class="active">LEAP Options</a>
  </nav>

  <div class="status-bar" id="status-bar">
    <span class="muted"><span class="spinner"></span>Loading LEAP chain…</span>
  </div>

  <div class="content">
    <div class="leap-wrap">
      <div id="leap-chart"></div>
      <div class="leap-side">
        <h3 id="leap-detail-title">Option History</h3>
        <p class="hint" id="leap-hint">Click any point on the chart to load its 6-month price history.</p>
        <img id="leap-detail-img" alt="" style="display:none" />
      </div>
    </div>
  </div>

  <script src="/static/leap.js"></script>
</body>
</html>
